            );
            rearTopRim.position.set(0, wallBaseY + postH - 0.0325, rearWallZ);
            rearTopRim.castShadow = true;
            partsContainerGroup.add(rearTopRim);

            // Front wall (facing stamping press exit -Z)
            // Lowered ergonomic intake cutout aligns right below the lower die level (stampingMaterialY = 2.175)
            // Bin floor is at Y = 1.31; die is at Y = 2.175.
            // Drop-front lip is at Y = 1.85, giving clear passage into the container from the press!
            const frontWallZ = -contD / 2 + wallThickness / 2;
            const frontWallH = 0.55;
            const frontWall = new THREE.Mesh(
                new THREE.BoxGeometry(contW - postSize * 2, frontWallH, wallThickness),
                containerBlueMat
            );
            frontWall.position.set(0, wallBaseY + frontWallH / 2, frontWallZ);
            frontWall.castShadow = true; frontWall.receiveShadow = true;
            partsContainerGroup.add(frontWall);

            [-0.14, 0.14].forEach(yOff => {
                const rib = new THREE.Mesh(
                    new THREE.BoxGeometry(contW - postSize * 2 - 0.04, 0.06, wallThickness + 0.035),
                    containerBlueMat
                );
                rib.position.set(0, wallBaseY + frontWallH / 2 + yOff, frontWallZ);
                rib.castShadow = true;
                partsContainerGroup.add(rib);
            });

            const frontTopRim = new THREE.Mesh(
                new THREE.BoxGeometry(contW - postSize * 2, 0.05, postSize * 0.95),
                containerRimMat
            );
            frontTopRim.position.set(0, wallBaseY + frontWallH - 0.025, frontWallZ);
            frontTopRim.castShadow = true;
            partsContainerGroup.add(frontTopRim);

            // ==================== 5. IDENTIFICATION PLACARD & SAFETY HAZARD STRIP ====================
            const placard = new THREE.Mesh(
                new THREE.BoxGeometry(0.60, 0.30, 0.02),
                containerLabelMat
            );
            placard.position.set(contW / 2 + 0.015, wallBaseY + postH * 0.65, 0);
            partsContainerGroup.add(placard);

            const placardBorder = new THREE.Mesh(
                new THREE.BoxGeometry(0.64, 0.34, 0.01),
                containerDarkMat
            );
            placardBorder.position.set(contW / 2 + 0.010, wallBaseY + postH * 0.65, 0);
            partsContainerGroup.add(placardBorder);

            if (typeof makeHazardTexture === 'function') {
                const hazardPlate = new THREE.Mesh(
                    new THREE.PlaneGeometry(contW - 0.3, 0.09),
                    new THREE.MeshStandardMaterial({ map: makeHazardTexture(), roughness: 0.85 })
                );
                hazardPlate.position.set(0, binBaseY + baseRunnerH * 0.5, frontWallZ - 0.018);
                partsContainerGroup.add(hazardPlate);

                const standHazard = hazardPlate.clone();
                standHazard.position.set(0, standH * 0.5, frontWallZ - 0.018);
                partsContainerGroup.add(standHazard);

                const rearHazardPlate = hazardPlate.clone();
                rearHazardPlate.rotation.y = Math.PI;
                rearHazardPlate.position.set(0, binBaseY + baseRunnerH * 0.5, rearWallZ + 0.018);
                partsContainerGroup.add(rearHazardPlate);
            }

            // Position entire container assembly in line directly downstream of stamping press
            partsContainerGroup.position.set(contCenterX, 0, contCenterZ);
            scene.add(partsContainerGroup);

            /* ===================== EXIT-SIDE VACUUM TRANSFER RAIL =====================
               Mounted along the same linear axis (transferRailSideX, transferRailY)
               extending from the stamping press rear inner pillar to directly over
               the elevated parts storage container.
               Picks up the formed sheet from the lower die cavity and carries it
               downstream into the container. */
            const exitTransferRailMat = transferRailMat;
            const exitTransferBracketMat = transferRailBracketMat;

            const exitRailY = transferRailY;
            const exitRailSideX = transferRailSideX;
            const exitRailStartZ = stampingCenterZ - 0.20;
            const exitRailEndZ = contCenterZ + 0.45;
            const exitRailLength = exitRailEndZ - exitRailStartZ;
            // Safe standby station: parked outside the rear press columns clear of upper die
            const exitStandbyZ = stampingCenterZ + (stampingBedDepth / 2) + 0.35;

            // 1. Horizontal Exit Transfer Rail Beam
            const exitTransferRail = new THREE.Mesh(
                new THREE.BoxGeometry(0.14, 0.14, exitRailLength),
                exitTransferRailMat
            );
            exitTransferRail.position.set(
                exitRailSideX,
                exitRailY,
                exitRailStartZ + exitRailLength / 2
            );
            exitTransferRail.castShadow = true; exitTransferRail.receiveShadow = true;
            scene.add(exitTransferRail);

            // Press-side rear mounting bracket arm attaching to press inner pillar
            const exitPressMountArm = new THREE.Mesh(
                new THREE.BoxGeometry(pressInnerPillarX - exitRailSideX, 0.14, 0.18),
                exitTransferBracketMat
            );
            exitPressMountArm.position.set(
                (exitRailSideX + pressInnerPillarX) / 2,
                exitRailY,
                exitRailStartZ + 0.15
            );
            exitPressMountArm.castShadow = true;
            scene.add(exitPressMountArm);

            const exitPressMount = new THREE.Mesh(
                new THREE.BoxGeometry(0.18, 0.20, 0.24),
                exitTransferBracketMat
            );
            exitPressMount.position.set(pressInnerPillarX, exitRailY, exitRailStartZ + 0.15);
            exitPressMount.castShadow = true;
            scene.add(exitPressMount);

            // Far-end support stanchion column extending to floor
            const exitStanchion = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, exitRailY, 0.12),
                exitTransferBracketMat
            );
            exitStanchion.position.set(exitRailSideX, exitRailY / 2, exitRailEndZ - 0.08);
            exitStanchion.castShadow = true; exitStanchion.receiveShadow = true;
            scene.add(exitStanchion);

            const exitStanchionSleeve = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 0.25, 0.16),
                containerYellowMat
            );
            exitStanchionSleeve.position.set(exitRailSideX, 0.125, exitRailEndZ - 0.08);
            scene.add(exitStanchionSleeve);

            const exitStanchionFoot = new THREE.Mesh(
                new THREE.BoxGeometry(0.24, 0.025, 0.24),
                containerDarkMat
            );
            exitStanchionFoot.position.set(exitRailSideX, 0.0125, exitRailEndZ - 0.08);
            scene.add(exitStanchionFoot);

            // 2. Moving Exit Carriage & Suction Gripper
            const exitTransferGroup = new THREE.Group();

            const exitCarriage = new THREE.Mesh(
                new THREE.BoxGeometry(0.24, 0.20, 0.30),
                exitTransferBracketMat
            );
            exitCarriage.position.set(exitRailSideX, exitRailY, exitStandbyZ);
            exitCarriage.castShadow = true;
            exitTransferGroup.add(exitCarriage);

            // Transverse horizontal arm extending inward to centerline (X = 0)
            const exitHandleStem = new THREE.Mesh(
                new THREE.BoxGeometry(1.5785, 0.09, 0.09),
                exitTransferBracketMat
            );
            exitHandleStem.position.set(-0.84925, 0, 0);
            exitHandleStem.castShadow = true;
            exitCarriage.add(exitHandleStem);

            const exitHandleGrip = new THREE.Mesh(
                new THREE.CylinderGeometry(0.075, 0.075, 0.28, 16),
                exitTransferRailMat
            );
            exitHandleGrip.rotation.z = Math.PI / 2;
            exitHandleGrip.position.set(-1.6385, 0, 0);
            exitHandleGrip.castShadow = true;
            exitCarriage.add(exitHandleGrip);

            // Telescoping vertical gripper assembly
            const exitVerticalAssembly = new THREE.Group();
            exitCarriage.add(exitVerticalAssembly);

            const exitVerticalBaseLength = 0.12;
            const exitVerticalHandle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.055, 0.055, exitVerticalBaseLength, 16),
                exitTransferRailMat
            );
            exitVerticalHandle.position.set(-1.6385, -exitVerticalBaseLength / 2, 0);
            exitVerticalHandle.castShadow = true;
            exitVerticalAssembly.add(exitVerticalHandle);

            const exitVacuumConnector = new THREE.Mesh(
                new THREE.CylinderGeometry(0.045, 0.045, 0.10, 16),
                exitTransferBracketMat
            );
            exitVacuumConnector.position.set(-1.6385, -exitVerticalBaseLength - 0.05, 0);
            exitVacuumConnector.castShadow = true;
            exitVerticalAssembly.add(exitVacuumConnector);

            const exitVacuumUpperBase = new THREE.Mesh(
                new THREE.BoxGeometry(0.36, 0.08, 0.36),
                exitTransferBracketMat
            );
            exitVacuumUpperBase.position.set(-1.6385, -exitVerticalBaseLength - 0.115, 0);
            exitVacuumUpperBase.castShadow = true;
            exitVerticalAssembly.add(exitVacuumUpperBase);

            const exitVacuumFingers = [];
            const exitVacuumCups = [];
            const exitVacuumPositions = [
                [-1.7385, -0.255, -0.10],
                [-1.5385, -0.255, -0.10],
                [-1.7385, -0.255, 0.10],
                [-1.5385, -0.255, 0.10]
            ];
            exitVacuumPositions.forEach(pos => {
                const finger = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.035, 0.035, 0.12, 16),
                    exitTransferRailMat
                );
                finger.position.set(pos[0], -exitVerticalBaseLength - 0.135, pos[2]);
                finger.castShadow = true;
                exitVerticalAssembly.add(finger);
                exitVacuumFingers.push(finger);

                const cup = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.055, 0.042, 0.045, 16),
                    exitTransferRailMat
                );
                cup.position.set(pos[0], -exitVerticalBaseLength - 0.215, pos[2]);
                cup.castShadow = true;
                exitVerticalAssembly.add(cup);
                exitVacuumCups.push(cup);
            });

            scene.add(exitTransferGroup);

            function setExitVacuumGripY(targetY) {
                const delta = (exitRailY - 0.3575) - targetY;
                const newLength = Math.max(0.02, exitVerticalBaseLength + delta);
                exitVerticalHandle.scale.y = newLength / exitVerticalBaseLength;
                exitVerticalHandle.position.y = -newLength / 2;
                exitVacuumConnector.position.y = -exitVerticalBaseLength - 0.05 - delta;
                exitVacuumUpperBase.position.y = -exitVerticalBaseLength - 0.115 - delta;
                exitVacuumFingers.forEach(finger => {
                    finger.position.y = -exitVerticalBaseLength - 0.135 - delta;
                });
                exitVacuumCups.forEach(cup => {
                    cup.position.y = -exitVerticalBaseLength - 0.215 - delta;
                });
                exitVerticalAssembly.userData.gripY = targetY;
            }

            function getExitVacuumGripY() {
                return exitVerticalAssembly.userData.gripY ?? (exitRailY - 0.3575);
            }

            setExitVacuumGripY(exitRailY - 0.3575);

            // Exit Transfer State Machine (interlocked & synchronized with stamping press)
            let exitTransferState = 'waitDie'; // 'waitDie' | 'moveToDie' | 'lowerToDie' | 'grip' | 'liftFromDie' | 'carryToContainer' | 'lowerIntoContainer' | 'release' | 'liftAfterRelease' | 'returnToStandby'
            let exitTransferTimer = 0;
            let exitTransferSheet = null;
            let exitTransferCarriageZ = exitStandbyZ;
            let exitContainerStackCount = 0;

            const exitPickupZ = stampingCenterZ;
            const exitPlaceZ = contCenterZ;
            const exitGripRestY = exitRailY - 0.3575;
            const exitLowerDiePickupY = stampingMaterialY + stripThickness / 2;

            function updateExitVacuumTransfer(dt) {
                if (typeof exitTransferState === 'undefined') {
                    exitTransferState = 'waitDie';
                    exitTransferTimer = 0;
                    exitTransferSheet = null;
                }

                exitTransferTimer += dt;

                const stackHeightOffset = Math.min(exitContainerStackCount, 4) * 0.028;
                const exitContainerDepositY = 1.35 + stackHeightOffset;

                switch (exitTransferState) {
                    case 'waitDie':
                        // Parked safely outside the press columns clear of the upper die
                        exitTransferCarriageZ = exitStandbyZ;
                        exitCarriage.position.z = exitStandbyZ;
                        setExitVacuumGripY(exitGripRestY);

                        // ONLY advance into the die cavity when press is idle/waiting with upper die safely raised
                        if (stampingState === 'waiting' &&
                            stampingPress.ramGroup.position.y >= (stampingRamIdleY - 0.04)) {
                            const candidate = cutToLength.pieces.find(p =>
                                p.visible && p.userData.readyForExit && !p.userData.exitVacuumHeld
                            );
                            if (candidate) {
                                exitTransferSheet = candidate;
                                exitTransferState = 'moveToDie';
                                exitTransferTimer = 0;
                            }
                        }
                        break;

                    case 'moveToDie':
                        // Fast servo advance into lower die cavity
                        exitTransferCarriageZ = THREE.MathUtils.lerp(
                            exitTransferCarriageZ,
                            exitPickupZ,
                            Math.min(1, dt * 14.0)
                        );
                        exitCarriage.position.z = exitTransferCarriageZ;
                        setExitVacuumGripY(exitGripRestY);

                        if (Math.abs(exitTransferCarriageZ - exitPickupZ) < 0.03) {
                            exitTransferCarriageZ = exitPickupZ;
                            exitCarriage.position.z = exitPickupZ;
                            exitTransferTimer = 0;
                            exitTransferState = 'lowerToDie';
                        }
                        break;

                    case 'lowerToDie':
                        // Fast vertical descent onto formed sheet
                        setExitVacuumGripY(
                            THREE.MathUtils.lerp(
                                exitGripRestY,
                                exitLowerDiePickupY,
                                Math.min(1, exitTransferTimer / 0.07)
                            )
                        );
                        if (exitTransferTimer >= 0.07) {
                            if (exitTransferSheet && exitTransferSheet.visible) {
                                exitTransferSheet.userData.exitVacuumHeld = true;
                                exitTransferSheet.userData.readyForExit = false;
                                exitTransferSheet.userData.onLowerDie = false;
                                exitTransferTimer = 0;
                                exitTransferState = 'grip';
                            } else {
                                exitTransferState = 'waitDie';
                            }
                        }
                        break;

                    case 'grip':
                        if (exitTransferTimer >= 0.04) {
                            exitTransferTimer = 0;
                            exitTransferState = 'liftFromDie';
                        }
                        break;

                    case 'liftFromDie':
                        // Fast vertical lift clear of lower die cavity
                        setExitVacuumGripY(
                            THREE.MathUtils.lerp(
                                exitLowerDiePickupY,
                                exitGripRestY,
                                Math.min(1, exitTransferTimer / 0.08)
                            )
                        );
                        if (exitTransferTimer >= 0.08) {
                            exitTransferTimer = 0;
                            exitTransferState = 'carryToContainer';
                        }
                        break;

                    case 'carryToContainer':
                        // High-speed transfer forward into container
                        exitTransferCarriageZ = THREE.MathUtils.lerp(
                            exitTransferCarriageZ,
                            exitPlaceZ,
                            Math.min(1, dt * 12.0)
                        );
                        exitCarriage.position.z = exitTransferCarriageZ;
                        setExitVacuumGripY(exitGripRestY);

                        if (Math.abs(exitTransferCarriageZ - exitPlaceZ) < 0.03) {
                            exitTransferCarriageZ = exitPlaceZ;
                            exitCarriage.position.z = exitPlaceZ;
                            exitTransferTimer = 0;
                            exitTransferState = 'lowerIntoContainer';
                        }
                        break;

                    case 'lowerIntoContainer':
                        // Fast vertical descent into container
                        setExitVacuumGripY(
                            THREE.MathUtils.lerp(
                                exitGripRestY,
                                exitContainerDepositY,
                                Math.min(1, exitTransferTimer / 0.09)
                            )
                        );
                        if (exitTransferTimer >= 0.09) {
                            exitTransferTimer = 0;
                            exitTransferState = 'release';
                        }
                        break;

                    case 'release':
                        if (exitTransferSheet) {
                            exitTransferSheet.userData.exitVacuumHeld = false;
                            exitTransferSheet.userData.inContainer = true;
                            exitTransferSheet.position.set(0, exitContainerDepositY, exitPlaceZ);
                            exitContainerStackCount = (exitContainerStackCount + 1) % 5;
                            exitTransferSheet = null;
                        }
                        if (exitTransferTimer >= 0.04) {
                            exitTransferTimer = 0;
                            exitTransferState = 'liftAfterRelease';
                        }
                        break;

                    case 'liftAfterRelease':
                        // Fast lift clear of container top
                        setExitVacuumGripY(
                            THREE.MathUtils.lerp(
                                exitContainerDepositY,
                                exitGripRestY,
                                Math.min(1, exitTransferTimer / 0.08)
                            )
                        );
                        if (exitTransferTimer >= 0.08) {
                            exitTransferTimer = 0;
                            exitTransferState = 'returnToStandby';
                        }
                        break;

                    case 'returnToStandby':
                        // High-speed return to standby position outside press
                        exitTransferCarriageZ = THREE.MathUtils.lerp(
                            exitTransferCarriageZ,
                            exitStandbyZ,
                            Math.min(1, dt * 14.0)
                        );
                        exitCarriage.position.z = exitTransferCarriageZ;
                        setExitVacuumGripY(exitGripRestY);

                        if (Math.abs(exitTransferCarriageZ - exitStandbyZ) < 0.03) {
                            exitTransferCarriageZ = exitStandbyZ;
                            exitCarriage.position.z = exitStandbyZ;
                            exitTransferTimer = 0;
                            exitTransferState = 'waitDie';
                        }
                        break;
                }

                // Lock carried sheet position to suction head
                if (exitTransferSheet && exitTransferSheet.userData.exitVacuumHeld) {
                    exitTransferSheet.position.x = 0;
                    exitTransferSheet.position.z = exitCarriage.position.z;
                    exitTransferSheet.position.y = getExitVacuumGripY() - stripThickness / 2;
                }
            }


            /* ---- Stamping press state machine (fully isolated from all existing animation state) ----
               Default/idle state is WAITING: the ram and upper die stay fully raised and the press stays
               completely stationary — no automatic up/down movement — until stampingMaterialPresent becomes
               true. Nothing in the existing decoiler/feeder/cutter code sets this flag, and this section does
               not modify the existing cut-sheet animation in any way, so by design the press simply waits, as
               requested, until a future transfer mechanism provides a material-presence signal. That signal is
               exposed via window.stampingPressAPI.setMaterialPresent(true/false) for that future mechanism to call. */
            let stampingState = 'waiting';   // 'waiting' | 'detecting' | 'descending' | 'forming' | 'holding' | 'ascending'
            let stampingTimer = 0;
            let stampingMaterialPresent = false;
            let stampingReadySheet = null;

            window.stampingPressAPI = window.stampingPressAPI || {};
            window.stampingPressAPI.setMaterialPresent = function (present) { stampingMaterialPresent = !!present; };
            window.stampingPressAPI.getState = function () { return stampingState; };
            const stampingPressAPISetMaterialPresent = window.stampingPressAPI.setMaterialPresent;

            // Deform only the sheet that is actually being stamped. The existing sheet geometry
            // already has sufficient subdivisions; this keeps the flat pickup/carry behavior and
            // changes its shape only during the existing press stroke.
            // Shape: shallow rectangular tray/pan — center stays flat, edges bend upward.
            function updateStampedSheetForm(sheet, progress) {
                if (!sheet || !sheet.geometry || !sheet.userData.formBasePositions) return;
                const pos = sheet.geometry.attributes.position;
                const base = sheet.userData.formBasePositions;
                const t = THREE.MathUtils.clamp(progress, 0, 1);
                const lipHeight = 0.06 * t;  // how far edges lift upward

                // The mesh is BoxGeometry(coilWidth, stripThickness, 1, 24, 1, 24)
                // Local X ranges: [-coilWidth/2, coilWidth/2], local Z: [-0.5, 0.5]
                // scale.z = cutLength is applied by Three.js at render time.
                const localHalfX = coilWidth / 2;  // ~0.925
                const localHalfZ = 0.5;             // unit box

                // The tray edge zone: outer 20% of each axis bends upward
                const edgeStartX = 0.78;  // fraction of halfX where bending starts
                const edgeStartZ = 0.78;  // fraction of halfZ where bending starts

                for (let i = 0; i < pos.count; i++) {
                    const x = base[i * 3];
                    const y = base[i * 3 + 1];
                    const z = base[i * 3 + 2];

                    // Normalized position [0, 1] from center to edge
                    const nx = Math.abs(x) / localHalfX;
                    const nz = Math.abs(z) / localHalfZ;

                    // Edge factor: 0 at center/flat region, rises to 1 at the outermost edge
                    const edgeX = THREE.MathUtils.smoothstep(nx, edgeStartX, 1.0);
                    const edgeZ = THREE.MathUtils.smoothstep(nz, edgeStartZ, 1.0);
                    const edgeFactor = Math.max(edgeX, edgeZ);

                    // Lift edges UP (positive Y) to form the tray lip
                    pos.setY(i, y + lipHeight * edgeFactor);
                }
                pos.needsUpdate = true;
                sheet.geometry.computeVertexNormals();
            }

            function updateStampingPress(dt) {
                switch (stampingState) {
                    case 'waiting':
                        // Idle: ram + upper die remain fully raised, machine completely stationary.
                        stampingPress.ramGroup.position.y = stampingRamIdleY;
                        stampingPress.updateRamSupports?.();
                        if (stampingMaterialPresent) { stampingState = 'detecting'; stampingTimer = 0; }
                        break;
                    case 'detecting':
                        // Confirm material is positioned AND both grippers are clear of the die space before starting stroke
                        stampingTimer += dt;
                        const entryClear = transferHandleCarriage.position.z <= (stampingCenterZ - 1.15);
                        const exitClear = exitCarriage.position.z >= (stampingCenterZ + 1.15);
                        if (stampingTimer >= 0.15 && entryClear && exitClear) {
                            stampingState = 'descending';
                            stampingTimer = 0;
                        }
                        break;
                    case 'descending': {
                        stampingTimer += dt;
                        const t = Math.min(stampingTimer / 0.35, 1);
                        stampingPress.ramGroup.position.y = THREE.MathUtils.lerp(stampingRamIdleY, stampingRamDownY, t);
                        stampingPress.updateRamSupports?.();
                        // No sheet deformation here — die hasn't contacted the sheet yet
                        if (t >= 1) { stampingState = 'forming'; stampingTimer = 0; }
                        break;
                    }
                    case 'forming': {
                        // Upper die has just contacted the sheet; now push down into the cavity
                        const formingDepth = 0.035; // how far the ram pushes past contact
                        stampingTimer += dt;
                        const t = Math.min(stampingTimer / 0.18, 1);
                        stampingPress.ramGroup.position.y = THREE.MathUtils.lerp(stampingRamDownY, stampingRamDownY - formingDepth, t);
                        stampingPress.updateRamSupports?.();
                        updateStampedSheetForm(stampingReadySheet, t);
                        if (t >= 1) { stampingState = 'holding'; stampingTimer = 0; }
                        break;
                    }
                    case 'holding':
                        // Ram fully down, pressing the material against the lower die.
                        updateStampedSheetForm(stampingReadySheet, 1);
                        stampingTimer += dt;
                        if (stampingTimer >= 0.25) { stampingState = 'ascending'; stampingTimer = 0; }
                        break;
                    case 'ascending': {
                        stampingTimer += dt;
                        const formingDepth = 0.035;
                        const t = Math.min(stampingTimer / 0.4, 1);
                        stampingPress.ramGroup.position.y = THREE.MathUtils.lerp(stampingRamDownY - formingDepth, stampingRamIdleY, t);
                        stampingPress.updateRamSupports?.();
                        if (t >= 1) {
                            // One full cycle complete — reset to WAITING and consume this detection so the
                            // press performs exactly one stamp per detected piece, not a continuous loop.
                            stampingState = 'waiting';
                            stampingTimer = 0;
                            stampingMaterialPresent = false;
                            if (stampingReadySheet) {
                                stampingReadySheet.userData.onLowerDie = true;
                                stampingReadySheet.userData.formed = true;
                                stampingReadySheet.userData.readyForExit = true;
                            }
                            stampingReadySheet = null;
                        }
                        break;
                    }
                }
                // Sensor indicator lamp: purely visual feedback of current state.
                if (stampingPress.sensorLens) {
                    const stampingActive = stampingState !== 'waiting';
                    stampingPress.sensorLens.material.color.setHex(stampingActive ? 0x35d15a : 0xff3b30);
                    stampingPress.sensorLens.material.emissive.setHex(stampingActive ? 0x35d15a : 0xff3b30);
                }
            }

            /* ===================== ANIMATION STATE ===================== */
            let spinSpeedRPM = 65;          // controlled by slider
            let spinAngle = 0;
            let fedLength = 0;
            let scrollOffset = 0;
            let playing = true;
            let lengthSinceCut = 0;         // cut-to-length machine: accumulated strip length since the last cut
            let bladePhase = 'idle';        // 'idle' | 'descending' | 'holding' | 'ascending'
            let bladeTimer = 0;
            const clock = new THREE.Clock();

            const speedSlider = document.getElementById('speedSlider');
            const rpmValueEl = document.getElementById('rpmValue');
            const feedValueEl = document.getElementById('feedValue');
            const playBtn = document.getElementById('playBtn');

            speedSlider.addEventListener('input', () => { spinSpeedRPM = parseFloat(speedSlider.value); });
            playBtn.addEventListener('click', () => {
                playing = !playing;
                playBtn.textContent = playing ? 'PAUSE LINE' : 'RESUME LINE';
            });

            // Vacuum transfer animation state (additive; controls only the sheet pickup/carry/place cycle).
            let vacuumTransferState = 'toPickup';
            let vacuumTransferTimer = 0;
            let vacuumTransferSheet = null;
            let vacuumTransferBusy = false;
            let cutReadySheet = null;

            function animate() {
                requestAnimationFrame(animate);
                const dt = Math.min(clock.getDelta(), 0.05);

                if (playing) {
                    // ===================== VACUUM SHEET TRANSFER =====================
                    // Sequence:
                    // 1) move to the cut sheet
                    // 2) lower vacuum fingers
                    // 3) grip the sheet
                    // 4) lift it
                    // 5) carry it along the existing rail
                    // 6) lower onto the lower die
                    // 7) release the sheet
                    // 8) lift and return for the next sheet

                    if (typeof vacuumTransferState === 'undefined') {
                        vacuumTransferState = 'toPickup';
                        vacuumTransferTimer = 0;
                        vacuumTransferSheet = null;
                        vacuumTransferBusy = false;
                    }

                    vacuumTransferTimer += dt;

                    const pickupZ = cutToLength.cutZ + cutToLength.cutLength / 2;
                    const placeZ = stampingCenterZ;
                    const pickupY = cutToLength.pieceCenterY;
                    const lowerDieY = stampingMaterialY + stripThickness / 2;

                    const gripX = -1.6385;
                    const gripRestY = transferRailY - 0.3575;
                    // The vacuum cups contact the actual TOP surface of the sheet.
                    // The sheet mesh is centered at pickupY/lowerDieY and its thickness
                    // is stripThickness, so its top surface is center + half thickness.
                    const gripPickupY = pickupY + stripThickness / 2;
                    const gripPlaceY = lowerDieY + stripThickness / 2;

                    function attachSheetToVacuum(sheet) {
                        if (!sheet || !sheet.visible) return;
                        vacuumTransferSheet = sheet;
                        sheet.userData.vacuumHeld = true;
                        sheet.userData.vacuumOffsetY = gripPickupY - sheet.position.y;
                    }

                    function releaseSheetFromVacuum() {
                        if (!vacuumTransferSheet) return;
                        vacuumTransferSheet.userData.vacuumHeld = false;
                        vacuumTransferSheet = null;
                    }

                    switch (vacuumTransferState) {
                        case 'toPickup':
                            // Move the carriage to the cut-sheet pickup point.
                            transferHandleZ = THREE.MathUtils.lerp(
                                transferHandleZ,
                                pickupZ,
                                Math.min(1, dt * 5.0)
                            );
                            transferHandleCarriage.position.z = transferHandleZ;
                            setVacuumGripY(gripRestY);

                            if (Math.abs(transferHandleZ - pickupZ) < 0.03) {
                                transferHandleZ = pickupZ;
                                transferHandleCarriage.position.z = pickupZ;
                                // Do not lower/grip until the cutter has actually completed a cut.
                                // The gripper waits at the pickup position for the cut-ready sheet.
                                if (cutReadySheet) {
                                    vacuumTransferTimer = 0;
                                    vacuumTransferState = 'lowerToPickup';
                                }
                            }
                            break;

                        case 'lowerToPickup':
                            // Lower the complete vacuum assembly onto the cut sheet.
                            setVacuumGripY(
                                THREE.MathUtils.lerp(
                                    gripRestY,
                                    gripPickupY,
                                    Math.min(1, vacuumTransferTimer / 0.08)
                                )
                            );

                            if (vacuumTransferTimer >= 0.08) {
                                const candidate = cutReadySheet &&
                                    cutReadySheet.visible &&
                                    !cutReadySheet.userData.vacuumHeld &&
                                    Math.abs(cutReadySheet.position.z - pickupZ) < 0.08
                                    ? cutReadySheet : null;

                                if (candidate) {
                                    // Put the sheet exactly beneath the four vacuum cups.
                                    candidate.position.x = transferHandleCarriage.position.x + gripX;
                                    candidate.position.z = pickupZ;
                                    candidate.position.y = pickupY;
                                    attachSheetToVacuum(candidate);
                                    candidate.userData.cutReady = false;
                                    cutReadySheet = null;
                                    vacuumTransferTimer = 0;
                                    vacuumTransferState = 'gripped';
                                }
                            }
                            break;

                        case 'gripped':
                            // Vacuum has picked the sheet; hold it briefly before lifting.
                            if (vacuumTransferSheet) {
                                vacuumTransferSheet.position.x =
                                    transferHandleCarriage.position.x + gripX;
                                vacuumTransferSheet.position.z = transferHandleCarriage.position.z;
                                vacuumTransferSheet.position.y =
                                    pickupY + (getVacuumGripY() - gripPickupY);
                            }

                            if (vacuumTransferTimer >= 0.04) {
                                vacuumTransferTimer = 0;
                                vacuumTransferState = 'liftFromPickup';
                            }
                            break;

                        case 'liftFromPickup':
                            setVacuumGripY(
                                THREE.MathUtils.lerp(
                                    gripPickupY,
                                    gripRestY,
                                    Math.min(1, vacuumTransferTimer / 0.08)
                                )
                            );

                            if (vacuumTransferSheet) {
                                vacuumTransferSheet.position.x =
                                    transferHandleCarriage.position.x + gripX;
                                vacuumTransferSheet.position.z = transferHandleCarriage.position.z;
                                vacuumTransferSheet.position.y =
                                    pickupY + (getVacuumGripY() - gripPickupY);
                            }

                            if (vacuumTransferTimer >= 0.08) {
                                vacuumTransferTimer = 0;
                                vacuumTransferState = 'carryToPress';
                            }
                            break;

                        case 'carryToPress':
                            // Real-life safety interlock: pause outside die entrance if press is active,
                            // or exit gripper is currently inside the die space, or a formed sheet is still waiting to be removed
                            const dieOccupied = (stampingState !== 'waiting') ||
                                (exitCarriage.position.z < exitStandbyZ - 0.15) ||
                                cutToLength.pieces.some(p => p.visible && (p.userData.readyForExit || p.userData.onLowerDie));

                            const targetEntryZ = dieOccupied ? (stampingCenterZ - 1.25) : placeZ;

                            transferHandleZ = THREE.MathUtils.lerp(
                                transferHandleZ,
                                targetEntryZ,
                                Math.min(1, dt * 10.0)
                            );
                            transferHandleCarriage.position.z = transferHandleZ;
                            setVacuumGripY(gripRestY);

                            if (vacuumTransferSheet) {
                                vacuumTransferSheet.position.x =
                                    transferHandleCarriage.position.x + gripX;
                                vacuumTransferSheet.position.z = transferHandleCarriage.position.z;
                                vacuumTransferSheet.position.y =
                                    pickupY + (getVacuumGripY() - gripPickupY);
                            }

                            if (!dieOccupied && Math.abs(transferHandleZ - placeZ) < 0.03) {
                                transferHandleZ = placeZ;
                                transferHandleCarriage.position.z = placeZ;
                                vacuumTransferTimer = 0;
                                vacuumTransferState = 'lowerToDie';
                            }
                            break;

                        case 'lowerToDie':
                            setVacuumGripY(
                                THREE.MathUtils.lerp(
                                    gripRestY,
                                    gripPlaceY,
                                    Math.min(1, vacuumTransferTimer / 0.08)
                                )
                            );

                            if (vacuumTransferSheet) {
                                vacuumTransferSheet.position.x =
                                    transferHandleCarriage.position.x + gripX;
                                vacuumTransferSheet.position.z = transferHandleCarriage.position.z;
                                vacuumTransferSheet.position.y =
                                    lowerDieY + (getVacuumGripY() - gripPlaceY);
                            }

                            if (vacuumTransferTimer >= 0.08) {
                                if (vacuumTransferSheet) {
                                    // Perfect final placement: centered on the lower die.
                                    vacuumTransferSheet.position.set(
                                        0,
                                        lowerDieY,
                                        stampingCenterZ
                                    );
                                    stampingReadySheet = vacuumTransferSheet;
                                    vacuumTransferSheet.userData.onLowerDie = true;
                                }
                                vacuumTransferTimer = 0;
                                vacuumTransferState = 'release';
                            }
                            break;

                        case 'release':
                            // Vacuum OFF: sheet remains on the lower die.
                            releaseSheetFromVacuum();
                            if (vacuumTransferTimer >= 0.04) {
                                vacuumTransferTimer = 0;
                                vacuumTransferState = 'liftAfterPlace';
                            }
                            break;

                        case 'liftAfterPlace':
                            setVacuumGripY(
                                THREE.MathUtils.lerp(
                                    gripPlaceY,
                                    gripRestY,
                                    Math.min(1, vacuumTransferTimer / 0.08)
                                )
                            );

                            if (!stampingMaterialPresent &&
                                stampingState === 'waiting' &&
                                stampingReadySheet &&
                                stampingReadySheet.visible &&
                                vacuumTransferTimer >= 0.04) {
                                stampingPressAPISetMaterialPresent(true);
                            }

                            if (vacuumTransferTimer >= 0.08) {
                                vacuumTransferTimer = 0;
                                vacuumTransferState = 'returnToPickup';
                            }
                            break;

                        case 'returnToPickup':
                            transferHandleZ = THREE.MathUtils.lerp(
                                transferHandleZ,
                                pickupZ,
                                Math.min(1, dt * 5.0)
                            );
                            transferHandleCarriage.position.z = transferHandleZ;
                            setVacuumGripY(gripRestY);

                            if (Math.abs(transferHandleZ - pickupZ) < 0.03) {
                                transferHandleZ = pickupZ;
                                transferHandleCarriage.position.z = pickupZ;
                                vacuumTransferTimer = 0;
                                vacuumTransferState = 'toPickup';
                            }
                            break;
                    }

                    // Keep a held sheet physically attached to the vacuum head during every
                    // transfer state. The sheet is not moved by the ordinary downstream
                    // cut-sheet conveyor animation while it is being carried.
                    if (vacuumTransferSheet && vacuumTransferSheet.userData.vacuumHeld) {
                        vacuumTransferSheet.position.x =
                            transferHandleCarriage.position.x + gripX;
                        vacuumTransferSheet.position.z =
                            transferHandleCarriage.position.z;
                        if (vacuumTransferState !== 'lowerToDie') {
                            vacuumTransferSheet.position.y =
                                pickupY + (getVacuumGripY() - gripPickupY);
                        }
                    }

                    // One shared line-speed value drives the coil, NC servo, cutter and downstream
                    // sheet motion. The cap is only a synchronization limit: the line never pauses;
                    // it simply cannot run faster than the downstream press cycle can consume sheets.
                    const synchronizedRPM = Math.min(spinSpeedRPM, 8.0);
                    const omega = (synchronizedRPM * 2 * Math.PI) / 60;   // rad/s
                    const tangentialSpeed = omega * R;              // world units / sec — shared line speed

                    spinAngle -= omega * dt;
                    coilMesh.rotation.y = spinAngle;

                    fedLength = Math.min(curveLength, fedLength + tangentialSpeed * dt);
                    scrollOffset += tangentialSpeed * dt;

                    const fedFraction = fedLength / curveLength;
                    const activeSegments = Math.max(1, Math.min(maxSegments, Math.floor(fedFraction * maxSegments)));
                    ribbonTopGeo.setDrawRange(0, activeSegments * 6);
                    ribbonBottomGeo.setDrawRange(0, activeSegments * 6);

                    const uvShift = -(scrollOffset / 1.1) % 1;
                    stripTexTop.offset.x = uvShift;
                    stripTexBottom.offset.x = uvShift;

                    // --- NC servo feeder: rotate driven parts about their own fixed shaft axis ---
                    // Strip feed direction     : WORLD +Z
                    // Roller/shaft local axis  : WORLD X (CylinderGeometry's default local-Y
                    //   axis, re-oriented once at creation via rotation.z = 90°).
                    // BUG THIS REPLACES: overwriting rotation.y directly on an object that
                    //   also has rotation.z set re-derives the whole Euler triple every
                    //   frame; under three.js's default 'XYZ' Euler order that does not spin
                    //   the mesh about its own shaft axis — the shaft axis itself sweeps
                    //   through world space each frame, so the roller visibly wobbles/tumbles
                    //   instead of spinning in place.
                    // FIX: Object3D.rotateY() composes a small delta rotation about the
                    //   object's CURRENT local Y axis via quaternions. Rotating an object
                    //   about its own axis can never move that axis, so the shaft stays
                    //   fixed on world X and only the spin around it accumulates.
                    const feedRollOmega = tangentialSpeed / servoFeeder.rollRadius;

                    // Lower roll: contact line is on TOP of the roll (touching the strip's
                    // underside). This sign drives that contact line toward +Z.
                    servoFeeder.lowerRoll.rotateY(-feedRollOmega * dt);

                    // Upper roll: contact line is on the BOTTOM of the roll (touching the
                    // strip's top face) — the opposite side of the strip from the lower
                    // roll's contact line. It spins in the OPPOSITE angular direction so
                    // that its contact line ALSO moves toward +Z, gripping and feeding the
                    // strip forward between the two rolls rather than fighting each other.
                    servoFeeder.upperRoll.rotateY(feedRollOmega * dt);

                    // Servo motor -> gearbox -> coupling -> lower roll: same angular
                    // direction as the roll it drives; motor spins 3x for a visual
                    // gearbox step-up. Both rotate about their own shaft axis (world X).
                    servoFeeder.feederCoupling.rotateY(-feedRollOmega * dt);
                    servoFeeder.feederMotor.rotateY(-feedRollOmega * 3 * dt);

                    // Inlet guide sits ABOVE the strip (contact line on its underside) —
                    // the same geometric situation as the upper roll, so it takes the
                    // opposite sign from the outlet guide below.
                    servoFeeder.guideIn.rotateY(feedRollOmega * dt);
                    // Outlet guide sits BELOW the strip (contact line on its topside) —
                    // the same situation as the lower roll.
                    servoFeeder.guideOut.rotateY(-feedRollOmega * dt);

                    coupling.rotation.y = spinAngle;

                    // --- Cut-to-Length machine (new, additive — reads tangentialSpeed/dt only) ---------------
                    // The NC servo feeder above keeps feeding continuously exactly as before; this block only
                    // drives the new downstream machine's own blade cycle and sheet pieces.
                    const growing = cutToLength.pieces[cutToLength.growingIndex];
                    if (bladePhase === 'idle') {
                        // Do not create the cut-sheet representation until the continuously fed
                        // material has physically reached the cutter.
                        if (fedLength >= cutReachLength) {
                            // Strip accumulates length only while idle — this is what makes the strip
                            // "stop" advancing into the cut zone once the blade begins its stroke.
                            lengthSinceCut = Math.min(cutToLength.cutLength, lengthSinceCut + tangentialSpeed * dt);
                        }
                        const curLen = Math.max(lengthSinceCut, 0.001);
                        growing.scale.z = curLen;
                        growing.position.z = cutToLength.cutZ + curLen / 2;
                        growing.visible = true;
                        if (lengthSinceCut >= cutToLength.cutLength &&
                            cutReadySheet === null &&
                            vacuumTransferSheet === null) {
                            bladePhase = 'descending'; bladeTimer = 0;
                        }
                    } else if (bladePhase === 'descending') {
                        // Blade moves down through the strip — no new length accumulates during the stroke.
                        bladeTimer += dt;
                        const t = Math.min(bladeTimer / 0.18, 1);
                        cutToLength.bladeHolder.position.y = THREE.MathUtils.lerp(cutToLength.holderTravelTop, cutToLength.holderTravelBottom, t);
                        if (t >= 1) { bladePhase = 'holding'; bladeTimer = 0; }
                    } else if (bladePhase === 'holding') {
                        // Blade fully down — the cut happens here.
                        bladeTimer += dt;
                        if (bladeTimer >= 0.12) {
                            // Release the just-finished sheet (it keeps its current mesh/position) and
                            // start a brand-new growing sheet right at the cut line. Never recycle a mesh
                            // that has already been handed off to the lower die or is still held by vacuum.
                            let nextIndex = cutToLength.growingIndex;
                            for (let step = 1; step <= cutToLength.pieces.length; step++) {
                                const candidateIndex = (cutToLength.growingIndex + step) % cutToLength.pieces.length;
                                const candidate = cutToLength.pieces[candidateIndex];
                                if (!candidate.userData.onLowerDie && !candidate.userData.vacuumHeld && !candidate.userData.exitVacuumHeld && !candidate.userData.inContainer) {
                                    nextIndex = candidateIndex;
                                    break;
                                }
                            }
                            // If all pieces in container, allow recycling oldest stored piece
                            if (nextIndex === cutToLength.growingIndex) {
                                for (let step = 1; step <= cutToLength.pieces.length; step++) {
                                    const candidateIndex = (cutToLength.growingIndex + step) % cutToLength.pieces.length;
                                    const candidate = cutToLength.pieces[candidateIndex];
                                    if (!candidate.userData.onLowerDie && !candidate.userData.vacuumHeld && !candidate.userData.exitVacuumHeld) {
                                        nextIndex = candidateIndex;
                                        break;
                                    }
                                }
                            }
                            if (nextIndex !== cutToLength.growingIndex ||
                                (!cutToLength.pieces[nextIndex].userData.onLowerDie && !cutToLength.pieces[nextIndex].userData.vacuumHeld && !cutToLength.pieces[nextIndex].userData.exitVacuumHeld)) {
                                const finishedSheet = cutToLength.pieces[cutToLength.growingIndex];
                                finishedSheet.userData.cutReady = true;
                                finishedSheet.userData.onLowerDie = false;
                                finishedSheet.userData.vacuumHeld = false;
                                finishedSheet.userData.exitVacuumHeld = false;
                                finishedSheet.userData.inContainer = false;
                                cutReadySheet = finishedSheet;

                                cutToLength.growingIndex = nextIndex;
                                const next = cutToLength.pieces[cutToLength.growingIndex];
                                const pos = next.geometry.attributes.position;
                                const base = next.userData.formBasePositions;
                                if (pos && base) {
                                    pos.array.set(base);
                                    pos.needsUpdate = true;
                                    next.geometry.computeVertexNormals();
                                }
                                next.userData.onLowerDie = false;
                                next.userData.vacuumHeld = false;
                                next.userData.exitVacuumHeld = false;
                                next.userData.inContainer = false;
                                next.userData.cutReady = false;
                                next.scale.z = 0.001;
                                next.position.set(0, cutToLength.pieceCenterY, cutToLength.cutZ);
                                next.visible = true;
                                lengthSinceCut = 0;
                            }
                            bladePhase = 'ascending'; bladeTimer = 0;
                        }
                    } else if (bladePhase === 'ascending') {
                        // Blade retracts clear of the strip before the next sheet is allowed to grow.
                        bladeTimer += dt;
                        const t = Math.min(bladeTimer / 0.22, 1);
                        cutToLength.bladeHolder.position.y = THREE.MathUtils.lerp(cutToLength.holderTravelBottom, cutToLength.holderTravelTop, t);
                        if (t >= 1) { bladePhase = 'idle'; bladeTimer = 0; }
                    }

                    // Already-cut sheets slide away downstream at the same line speed as the strip.
                    cutToLength.pieces.forEach((mesh, idx) => {
                        if (idx === cutToLength.growingIndex || !mesh.visible) return;
                        if (mesh.userData.vacuumHeld || mesh.userData.onLowerDie || mesh.userData.cutReady || mesh.userData.exitVacuumHeld || mesh.userData.inContainer) return;
                        mesh.position.z += tangentialSpeed * dt;
                        if (mesh.position.z - mesh.scale.z / 2 > cutToLength.exitLimitZ) {
                            mesh.visible = false;
                        }
                    });

                    rpmValueEl.textContent = synchronizedRPM.toFixed(1);
                    feedValueEl.textContent = (tangentialSpeed * 60).toFixed(1);

                    // Single additive integration point for the new stamping press: its own state machine
                    // and animation are fully self-contained in updateStampingPress(); nothing above this
                    // line was changed to add it.
                    updateStampingPress(dt);
                    updateExitVacuumTransfer(dt);
                }

                renderer.render(scene, camera);
            }
            animate();

        })();
    </script>
</body>

</html>
